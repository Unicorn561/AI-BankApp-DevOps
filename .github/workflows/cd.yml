name: CD - Deploy & DAST

on:
  workflow_call:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2 via SSH
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Remote Directory
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/bankapp

      - name: Copy app-tier.yml to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "app-tier.yml"
          target: "~/bankapp"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            AWS_ACCOUNT_ID="120766981892"
            AWS_REGION="us-west-2"
            ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
            REPO_NAME="bankapp"

            echo "Logging into Amazon ECR..."
            aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}

            echo "Pulling latest application image..."
            docker pull ${ECR_REGISTRY}/${REPO_NAME}:latest

            cd ~/bankapp
            echo "Starting containers via Docker Compose..."
            docker compose -f app-tier.yml down || true
            docker compose -f app-tier.yml up -d

            echo "Waiting for service to start..."
            sleep 15
            docker ps

  dast:
    name: DAST - OWASP ZAP Baseline Scan
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Run OWASP ZAP Baseline Scan
        continue-on-error: true
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://${{ secrets.EC2_HOST }}:8080"
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
