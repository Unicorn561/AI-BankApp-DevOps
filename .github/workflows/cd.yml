name: CD - Deploy & DAST

on:
  workflow_call:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2 via SSH
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Container via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "Authenticating with Amazon ECR..."
            aws ecr get-login-password --region us-west-2 | docker login --username AWS --password-stdin 120766981892.dkr.ecr.us-west-2.amazonaws.com

            echo "Stopping and removing existing application container..."
            docker stop bankapp 2>/dev/null || true
            docker rm bankapp 2>/dev/null || true

            echo "Pulling latest image from ECR..."
            docker pull 120766981892.dkr.ecr.us-west-2.amazonaws.com/bankapp:latest

            echo "Launching bankapp container..."
            docker run -d \
              --name bankapp \
              --restart always \
              -p 8080:8080 \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e OLLAMA_BASE_URL=http://172.31.38.112:11434 \
              120766981892.dkr.ecr.us-west-2.amazonaws.com/bankapp:latest

            echo "Waiting for container startup..."
            sleep 15
            docker ps

  dast:
    name: DAST - OWASP ZAP Baseline Scan
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Run OWASP ZAP Baseline Scan
        continue-on-error: true
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://${{ secrets.EC2_HOST }}:8080"
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
